function pear(a,b){const n=a.length;if(n<3)return 0;const ma=a.reduce((x,y)=>x+y,0)/n,mb=b.reduce((x,y)=>x+y,0)/n;let s=0,x=0,y=0;for(let i=0;i<n;i++){s+=(a[i]-ma)*(b[i]-mb);x+=(a[i]-ma)**2;y+=(b[i]-mb)**2}return x&&y?s/Math.sqrt(x*y):0}

const wdi=k=>(new Date(k+"T00:00:00").getDay()+6)%7;
function act(h,k){return(!h.c||k>=h.c)&&(!h.arch||k<h.arch)&&(!h.days||h.days.includes(wdi(k)))}

let vs=false;
function seedVocab(){const t=(w,m,ex,k)=>({id:uid(),w,m,ex,ef:2.5,iv:k>0?3:0,rp:k>0?2:0,due:ds(addD(new Date(),k))});return[t("경제","iqtisodiyot","경제를 공부해요.",0),t("대학교","universitet","대학교에 가요.",0),t("장학금","stipendiya","장학금을 받아요.",0),t("기숙사","yotoqxona","기숙사에 살아요.",-1),t("등록금","oʻqish toʻlovi","등록금을 내요.",-2),t("수업","dars","수업이 시작돼요.",1),t("시험","imtihon","시험을 봐요.",2),t("도서관","kutubxona","도서관에서 공부해요.",3),t("예산","byudjet","예산을 세워요.",4),t("저축","jamgʻarma","매달 저축해요.",5),t("목표","maqsad","목표를 세워요.",6),t("습관","odat","좋은 습관을 만들어요.",7)]}
const cq=()=>S.vocab.filter(x=>x.due<=TODAY).sort((a,b)=>a.due<b.due?-1:a.due>b.due?1:(a.t||0)-(b.t||0));
function gr(q){const c=cq()[0];if(!c)return;if(q<3){c.rp=0;c.iv=0;c.ef=Math.max(1.3,c.ef-.2);c.due=TODAY;c.t=Date.now()}else{c.iv=c.rp==0?1:c.rp==1?6:Math.round(c.iv*c.ef);c.rp++;c.ef=Math.max(1.3,c.ef+.1-(5-q)*(.08+(5-q)*.02));c.due=ds(addD(new Date(),c.iv))}S.vrev=(S.vrev||0)+1;vs=false;save();render()}
function addV(){const w=$("vw").value.trim(),m=$("vm").value.trim();if(!w||!m)return toast("Soʻz va maʼnoni kiriting");S.vocab.push({id:uid(),w,m,ex:$("ve").value.trim(),ef:2.5,iv:0,rp:0,due:TODAY});save();render()}
function delV(id){S.vocab=S.vocab.filter(x=>x.id!=id);save();render()}
function vLugat(){const q=cq(),c=q[0],mt=S.vocab.filter(x=>x.iv>=21).length,sp=new Intl.DateTimeFormat?"":"";
 return`<h2>🈶 Lugʻat kartalari (oraliq takrorlash)</h2><div class="kpis">${[["Bugun takrorlash",q.length],["Jami soʻz",S.vocab.length],["Mustahkam (21+ kun)",mt],["Jami takrorlar",S.vrev||0]].map(k=>`<div class="card kpi"><div class="mu">${k[0]}</div><b>${k[1]}</b></div>`).join("")}</div>
 <div class="g2"><div class="card" style="text-align:center">${c?`<div class="mu">Navbatda: ${q.length} ta</div><div style="font-size:64px;margin:16px 0">${esc(c.w)}</div>${vs?`<div style="font-size:26px"><b>${esc(c.m)}</b></div><div class="mu" style="margin:6px 0 14px">${esc(c.ex||"")}</div><div class="row" style="justify-content:center"><button class="b d" onclick="gr(1)">Qayta</button><button class="b s" onclick="gr(3)">Qiyin</button><button class="b" onclick="gr(4)">Yaxshi</button><button class="b s" onclick="gr(5)">Oson</button></div>`:`<button class="b" onclick="vs=true;render()">Javobni koʻrsatish</button>`}`:`<div style="font-size:48px">🎉</div><h3>Bugungi takrorlar tugadi</h3><p class="mu">Keyingi karta: ${(S.vocab.map(x=>x.due).sort()[0])||"—"}</p>`}<p class="mu" style="margin-top:14px">SM-2 algoritmi: toʻgʻri javob oraligʻi 1 → 6 → ×oson-lik koeffitsiyenti kunlar bilan oshadi. Har takror 1 XP.</p></div>
 <div class="card"><h3>＋ Yangi soʻz</h3><div class="row"><input id="vw" placeholder="Soʻz (한국어)" style="width:140px"><input id="vm" placeholder="Maʼnosi" style="flex:1 1 120px"><input id="ve" placeholder="Misol gap" style="flex:1 1 160px"><button class="b" onclick="addV()">＋</button></div>
 <div style="margin-top:10px;max-height:300px;overflow:auto">${S.vocab.slice().sort((a,b)=>a.due<b.due?-1:1).map(x=>`<div class="hab"><b>${esc(x.w)}</b><span class="sp mu">${esc(x.m)}</span><span class="tag">${x.due<=TODAY?"bugun":x.due.slice(5)}</span><button class="b s sm" onclick="delV('${x.id}')">✕</button></div>`).join("")}</div></div></div>`}
/* ---------- 0 DAN BOSHLASH ---------- */
function blank(){return{goals:[],habits:[],logs:{},bio:{},focus:[],tasks:[],fin:[],rev:{},books:[],ideas:[],vocab:[],vrev:0,theme:S.theme}}
function bl(){if(confirm("Barcha maʼlumotlar (demo ham, oʻzingiznikilar ham) oʻchiriladi va ilova 0 dan boshlanadi. Avval Eksport qilib oling. Davom etilsinmi?")){S=blank();save();tab="bosh";render();toast("Ilova 0 dan boshlandi")}}
function hint(){return`<div class="card"><h3>🚀 Boshlash uchun 3 qadam</h3><p>1) <b>Maqsadlar</b> boʻlimida yillik maqsad qoʻshing (ixtiyoriy).<br>2) <b>Bugun</b> boʻlimida odat qoʻshing va maqsadga bogʻlang.<br>3) Har kuni odatlarni belgilab, bio-jurnalni toʻldiring.</p><div class="row"><button class="b" onclick="go('maqsad')">🎯 Maqsad qoʻshish</button><button class="b s" onclick="go('bugun')">☀️ Odat qoʻshish</button></div></div>`}
function welcome(){const o=document.createElement("div");o.id="wel";o.style.cssText="position:fixed;inset:0;background:#000b;z-index:30;display:flex;align-items:center;justify-content:center;padding:16px";o.innerHTML='<div class="card" style="max-width:520px;margin:0"><h2>🧭 Hayot OS ga xush kelibsiz</h2><p>Qanday boshlaymiz?</p><button class="b" style="width:100%;margin-bottom:10px" id="wc">☁️ Google orqali kirish va bulutdan tiklash</button><button class="b s" style="width:100%;margin-bottom:10px" id="wd">🧪 Demo maʼlumot bilan — barcha boʻlimlar toʻla koʻrinadi</button><button class="b s" style="width:100%" id="wb">🆕 0 dan boshlash — hammasi boʻsh</button><p class="mu">Avval boshqa qurilmada ishlatgan boʻlsangiz, Google orqali kiring.</p></div>';document.body.appendChild(o);$("wc").onclick=()=>cloudLogin();$("wd").onclick=()=>{save();o.remove()};$("wb").onclick=()=>{S=blank();save();tab="bosh";o.remove();render()}}

const firebaseConfig={
  apiKey:"AIzaSyBH4O6DuOrFUtq-mJLnBM2SfXO8nUpcc6E",
  authDomain:"salom-os-syns.firebaseapp.com",

};
function cloudInit(){
  try{
    if(!window.firebase){toast("Firebase kutubxonasi yuklanmadi. Internetni tekshiring.");return}
    if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
    cloudAuth=firebase.auth();cloudDb=firebase.firestore();
    cloudAuth.getRedirectResult().catch(e=>console.error("Google kirish:",e));
    cloudAuth.onAuthStateChanged(async user=>{
      cloudUser=user||null;cloudReady=false;
      if(cloudUnsub){cloudUnsub();cloudUnsub=null}
      if(!user){render();return}
      try{
        const ref=cloudDb.collection("users").doc(user.uid);
        const snap=await ref.get();
        if(snap.exists&&snap.data()&&snap.data().state){
          cloudApplying=true;S=snap.data().state;
          try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}
          cloudApplying=false;cloudReady=true;
          if($("wel"))$("wel").remove();
          toast("Bulutdagi maʼlumotlar yuklandi");render();
        }else{
          const hasLocal=!!localStorage.getItem(K);
          if(hasLocal){
            await ref.set({state:S,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
            cloudReady=true;toast("Ushbu qurilmadagi maʼlumotlar bulutga saqlandi");
            if($("wel"))$("wel").remove();render();
          }else{
            cloudReady=false;
            toast("Bulutda hali maʼlumot yoʻq. Avval maʼlumot bor qurilmadan Google orqali kiring.");
            await cloudAuth.signOut().catch(()=>{});
            return;
          }
        }
        cloudUnsub=ref.onSnapshot(docSnap=>{
          if(!docSnap.exists)return;
          const remote=docSnap.data()?.state;if(!remote)return;
          let localText="",remoteText="";
          try{localText=JSON.stringify(S);remoteText=JSON.stringify(remote)}catch(e){}
          if(remoteText&&remoteText!==localText){
            cloudApplying=true;S=remote;
            try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}
            cloudApplying=false;render();toast("Boshqa qurilmadagi yangilanish olindi");
          }
        },err=>{console.error(err);toast("Bulut sinxronlash xatosi: "+err.message)});
        render();
      }catch(e){
        cloudApplying=false;cloudReady=false;console.error("Cloud sync:",e);
        toast("Sinxronlash xatosi: "+(e.message||"sozlamalarni tekshiring"));render();
      }
    });
  }catch(e){console.error(e);toast("Firebase ishga tushmadi")}
}
function cloudLogin(){
  if(!cloudAuth){toast("Firebase hali yuklanmoqda. Bir oz kutib qayta bosing.");return}
  if(cloudUser){
    if(confirm("Google hisobidan chiqilsinmi? Bu qurilmadagi maʼlumotlar saqlanadi.")){
      cloudReady=false;cloudAuth.signOut().then(()=>toast("Google hisobidan chiqildi")).catch(e=>toast("Chiqishda xato: "+e.message))
    }
    return;
  }
  const provider=new firebase.auth.GoogleAuthProvider();
  provider.setCustomParameters({prompt:"select_account"});
  cloudAuth.signInWithRedirect(provider).catch(e=>toast("Google orqali kirishda xato: "+e.message));
}
function queueCloudSave(){
  if(cloudTimer)clearTimeout(cloudTimer);
  cloudTimer=setTimeout(async()=>{
    if(!cloudReady||!cloudUser||!cloudDb||cloudApplying)return;
    try{
      await cloudDb.collection("users").doc(cloudUser.uid).set({
        state:S,updatedAt:firebase.firestore.FieldValue.serverTimestamp()
      });
    }catch(e){console.error("Cloud save:",e);toast("Bulutga saqlanmadi: "+(e.message||"xato"))}
  },700);
}
render();if(FIRST)welcome();cloudInit();
